name: Validate source distribution

on:
  push:
    branches: [cfe-foundation]
    paths:
      - "CFE-Shogi-source-v0.1.0.tar.gz"
      - "SHA256SUMS"
      - ".github/workflows/expand-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: cfe-foundation

      - name: Verify archive integrity
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          tar -tzf CFE-Shogi-source-v0.1.0.tar.gz > /tmp/cfe-archive-files.txt
          if grep -Eq '(^/|(^|/)\\.\\.(/|$))' /tmp/cfe-archive-files.txt; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          test -s /tmp/cfe-archive-files.txt
          echo "Archive integrity and path checks passed."
