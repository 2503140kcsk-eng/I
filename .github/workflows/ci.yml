name: CFE core CI

on:
  push:
    branches: [main, cfe-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Verify source archive checksum
        run: sha256sum --check SHA256SUMS

      - name: Validate source archive paths
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf CFE-Shogi-source-v0.1.0.tar.gz > /tmp/cfe-archive-files.txt
          if grep -Eq '(^/|(^|/)\\.\\.(/|$))' /tmp/cfe-archive-files.txt; then
            echo "Unsafe source archive path" >&2
            exit 1
          fi
          test -s /tmp/cfe-archive-files.txt
