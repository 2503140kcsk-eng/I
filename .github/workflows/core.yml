name: CFE shogi core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q cfe_shogi.py tools tests
      - name: CLI smoke test
        run: python cfe_shogi.py --sfen 'lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1' --canonical --key --moves
      - name: Install isolated cshogi oracle
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements/cshogi-conformance.txt"
      - name: Compare shared SFEN corpus with cshogi
        run: python tools/conformance.py --engine cshogi
      - name: Install Rust compiler and Cargo
        run: sudo apt-get update && sudo apt-get install -y cargo
      - name: Compare shared SFEN corpus with shogi-rs
        run: python tools/conformance.py --engine shogi-rs
